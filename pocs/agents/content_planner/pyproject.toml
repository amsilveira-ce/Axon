[project]
name = "python_and_java_multiagent"
version = "0.1.0"
description = "Plan a trip using a multi-agent system communicating over A2A and using MCP"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click>=8.2.0",
    "geopy>=2.4.1",
    "google-adk[extensions]>=1.0.0",
    "gradio>=5.30.0",
    "a2a-sdk[http-server]>=0.3.3",
    "litellm>=1.0.0",
    "python-dotenv>=1.0.0",
    "uvicorn>=0.30.0",
    "starlette>=0.37.0"
]
